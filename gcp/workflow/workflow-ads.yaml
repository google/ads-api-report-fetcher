main:
  params: [args]
  steps:
    - init:
        assign:
          - project: ${sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}
          - scripts: ${args.scripts}
          - accounts: ${args.accounts}
          - root_cid: ${args.root_cid}
          - function_name: ${default(map.get(args, "function_name"), "gaarf")}
          - function_location: ${default(map.get(args, "function_location"), "us-central1")}
          - ads_config_path: ${args.ads_config_path}
          - api_version: ${default(map.get(args, "api_version"), "")}
          - writer: ${default(map.get(args, "writer"), "bq")}
          - bq_dataset: ${default(map.get(args, "bq_dataset"), "")}
          - bq_dataset_location: ${default(map.get(args, "bq_dataset_location"), "")}
          - macros: ${map.get(args, "macros")}
          - template_params: ${map.get(args, "template_params")}
          - writer_options: ${map.get(args, "writer_options")}
          - output_path: ${default(map.get(args, "output_path"), "")}
          - concurrency_limit: ${default(map.get(args, "concurrency_limit"), 20)}
          - heavy_scripts: ${default(map.get(args, "heavy_scripts"), [])}

    # get CF 'gaarf' function's URL
    - get_function:
        call: http.get
        args:
          url: ${"https://cloudfunctions.googleapis.com/v2/projects/" + project + "/locations/" + function_location + "/functions/" + function_name}
          auth:
            type: OAuth2
        result: function
        # TODO: move to using CF adapter when it's ready (currently only v1 supported):
        #call: googleapis.cloudfunctions.v2.projects.locations.functions.get
        #args:
        #  name: ${"projects/" + project + "/locations/" + function_location + "/functions/" + function_name}
        #result: function
    - initialize_functions_uris:
        assign:
          - gaarf_main_cf_uri: ${function.body.serviceConfig.uri}

    - initialize:
        assign:
          - tasks: []
          - error_occurred: false
          - error_message: ""

    # build a flattened list of tasks (script + account combinations)
    - build_tasks_list:
        for:
          value: script_item
          in: ${scripts}
          steps:
            - extract_script_name:
                assign:
                  - script_parts: ${text.split(script_item, "/")}
                  - script_file: ${script_parts[len(script_parts) - 1]}
                  - script_base: ${text.split(script_file, ".")[0]}
                  - is_heavy: ${script_file in heavy_scripts or script_base in heavy_scripts}
            - check_for_constant:
                switch:
                  - condition: ${text.match_regex(script_item, "_constant")}
                    next: add_constant_task
                next: add_account_tasks
            - add_constant_task:
                assign:
                  - current_task:
                      script: ${script_item}
                      account: ${accounts[0]}
                      is_constant: true
                      is_heavy: ${is_heavy}
                  - tasks: ${list.concat(tasks, current_task)}
                next: continue
            - add_account_tasks:
                for:
                  value: account_item
                  in: ${accounts}
                  steps:
                    - add_task:
                        assign:
                          - current_task:
                              script: ${script_item}
                              account: ${account_item}
                              is_constant: false
                              is_heavy: ${is_heavy}
                          - tasks: ${list.concat(tasks, current_task)}

    - log_tasks:
        call: sys.log
        args:
          data:
            text: "Executing Ads queries"
            total_tasks: ${len(tasks)}
            concurrency_limit: ${concurrency_limit}
          severity: "INFO"

    - parallel_loop_over_tasks:
        parallel:
          shared: [error_occurred, error_message]
          concurrency_limit: ${concurrency_limit}
          for:
            value: task
            in: ${tasks}
            steps:
              - check_for_errors:
                  switch:
                    - condition: ${error_occurred}
                      next: continue
              - execute_task:
                  try:
                    call: executeAdsQuery
                    args:
                      cf_uri: ${gaarf_main_cf_uri}
                      script_path: ${task.script}
                      account: ${task.account}
                      root_cid: ${root_cid}
                      macros: ${macros}
                      template_params: ${template_params}
                      project: ${project}
                      writer: ${writer}
                      bq_dataset: ${bq_dataset}
                      bq_dataset_location: ${bq_dataset_location}
                      ads_config_path: ${ads_config_path}
                      api_version: ${api_version}
                      writer_options: ${writer_options}
                      output_path: ${output_path}
                      is_constant: ${task.is_constant}
                      function_name: ${function_name}
                      function_location: ${function_location}
                      is_heavy: ${task.is_heavy}
                  except:
                    as: e
                    steps:
                      - set_error:
                          assign:
                            - error_occurred: true
                            - error_message: ${"Error in script " + task.script + " for account " + task.account + ":" + e.message}
                      - exit_loop:
                          next: continue

    - final_error_check:
        switch:
          - condition: ${error_occurred}
            next: handle_error
        next: workflow_success

    - handle_error:
        steps:
          - log_error:
              call: sys.log
              args:
                text: ${error_message}
                severity: ERROR
          - fail:
              raise: ${error_message}

    - workflow_success:
        return: "Workflow completed successfully"

    - end_workflow:
        return: null

executeAdsQuery:
  params:
    [
      cf_uri,
      script_path,
      account,
      root_cid,
      macros,
      template_params,
      project,
      writer,
      bq_dataset,
      bq_dataset_location,
      ads_config_path,
      api_version,
      writer_options,
      output_path,
      is_constant: false,
      function_name: "gaarf",
      function_location: "us-central1",
      is_heavy: false,
    ]
  steps:
    - init_vars:
        assign:
          - started: ${sys.now()}
    - check_execution_mode:
        switch:
          - condition: ${is_heavy}
            next: prepare_job_payload
        next: call_gaarf_cf
    - call_gaarf_cf:
        try:
          call: http.post
          args:
            url: ${cf_uri}
            timeout: 1800 # maximum allowed timeout in Workflows is 1800 (30min) despite the fact CF gen2 support 3600 (60min)
            query:
              script_path: ${script_path}
              ads_config_path: ${ads_config_path}
              api_version: ${api_version}
              bq_project_id: ${project}
              writer: ${writer}
              bq_dataset: ${bq_dataset}
              bq_dataset_location: ${bq_dataset_location}
              customer_id: ${account}
              root_cid: ${root_cid}
              output_path: ${output_path}
            body:
              macros: ${macros}
              template_params: ${template_params}
              writer_options: ${writer_options}
            auth:
              type: OIDC
          result: script_results
        retry:
          predicate: ${custom_retry_predicate}
          max_retries: 8
          backoff:
            initial_delay: 15
            max_delay: 120
            multiplier: 1.5
        next: log_script_result
    - log_script_result:
        call: sys.log
        args:
          data:
            is_constant: ${is_constant}
            mode: "http"
            query: ${script_path}
            account: ${account}
            rowCount: ${map.get(script_results.body, "" + account)}
            started: ${time.format(started)}
            elapsed: ${sys.now() - started}
          severity: "INFO"
        next: return_step
    - prepare_job_payload:
        assign:
          - job_payload:
              scriptPath: ${script_path}
              customerId: ${account}
              rootCid: ${root_cid}
              adsConfigPath: ${ads_config_path}
              apiVersion: ${api_version}
              projectId: ${project}
              writer: ${writer}
              bqDataset: ${bq_dataset}
              bqDatasetLocation: ${bq_dataset_location}
              outputPath: ${output_path}
              macros: ${macros}
              templateParams: ${template_params}
              writerOptions: ${writer_options}
    - execute_via_cloud_run_job:
        call: googleapis.run.v2.projects.locations.jobs.run
        args:
          name: ${"projects/" + project + "/locations/" + function_location + "/jobs/" + function_name + "-job"}
          body:
            overrides:
              containerOverrides:
                - env:
                    - name: GAARF_PAYLOAD
                      value: ${text.decode(json.encode(job_payload))}
          connector_params:
            timeout: 86400 # 24 hours max
        result: job_execution
        next: log_job_result
    - log_job_result:
        call: sys.log
        args:
          data:
            is_constant: ${is_constant}
            mode: "job"
            query: ${script_path}
            account: ${account}
            execution: ${job_execution}
            started: ${time.format(started)}
            elapsed: ${sys.now() - started}
          severity: "INFO"
        next: return_step
    - return_step:
        return: "OK"

custom_retry_predicate:
  params: [e]
  steps:
    - log_call_gaarf_cf_failure:
        call: sys.log
        args:
          data: ${e}
          severity: "WARNING"
    - normalize_fields:
        assign:
          - tags: ${default(map.get(e, "tags"), [])}
          - code: ${default(map.get(e, "code"),0)}
    - what_to_repeat:
        switch:
          # We'll repeat if it's a ConnectionError, TimeoutError or http statuses:
          #   429 - Too Many Requests
          #   500 - Internal Server Error
          #   502 - Bad Gateway
          #   503 - Service Unavailable
          #   504 - Gateway Timeout
          # NOTE: sometime errors happen inside Workflow and there's no any code
          # (i.e. "code" can be null, so DO NOT use operand ==,<,>,>=,<= without wrapping with `default`
          - condition: ${"ConnectionFailedError" in tags or "ConnectionError" in tags or "TimeoutError" in tags or "SystemError" in tags or code == 429 or code == 500 or code == 502 or code == 503 or code == 504}
            next: log_call_gaarf_cf_retry
    - otherwise:
        steps:
          - log_call_gaarf_cf_terminate:
              call: sys.log
              args:
                text: "Non repeatable error, breaking"
                severity: "ERROR"
          - return_false:
              return: false
    - log_call_gaarf_cf_retry:
        call: sys.log
        args:
          text: "Retrying"
          severity: "WARNING"
    - return_true:
        return: true
