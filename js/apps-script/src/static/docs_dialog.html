<!DOCTYPE html>
<html>

<head>
  <base target="_blank">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      --surface-bg: #1e293b;
      --glass-bg: rgba(30, 41, 59, 0.7);
      --glass-border: rgba(255, 255, 255, 0.1);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --code-bg: #0f172a;
      --accent: #818cf8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-gradient);
      color: var(--text);
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--glass-border);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header h2 {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 600;
      background: linear-gradient(to right, #818cf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .github-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.825rem;
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid var(--glass-border);
      background: var(--glass-bg);
      transition: all 0.2s ease;
    }

    .github-link:hover {
      color: var(--text);
      border-color: var(--primary);
      background: rgba(99, 102, 241, 0.15);
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 24px;
      width: 100%;
      flex: 1;
    }

    /* Markdown Styling */
    .markdown-body {
      color: var(--text);
      line-height: 1.65;
      font-size: 0.95rem;
    }

    .markdown-body h1,
    .markdown-body h2,
    .markdown-body h3,
    .markdown-body h4 {
      color: #f1f5f9;
      font-weight: 600;
      margin-top: 1.75em;
      margin-bottom: 0.75em;
      line-height: 1.3;
    }

    .markdown-body h1 {
      font-size: 1.75rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.4em;
    }

    .markdown-body h2 {
      font-size: 1.35rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 0.3em;
    }

    .markdown-body h3 {
      font-size: 1.15rem;
    }

    .markdown-body p {
      margin-top: 0;
      margin-bottom: 1em;
    }

    .markdown-body a {
      color: #818cf8;
      text-decoration: none;
    }

    .markdown-body a:hover {
      text-decoration: underline;
    }

    .markdown-body code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85em;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 0.2em 0.4em;
      border-radius: 4px;
      color: #e2e8f0;
    }

    .markdown-body pre {
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      overflow-x: auto;
      margin: 1em 0;
    }

    .markdown-body pre code {
      background: transparent;
      border: none;
      padding: 0;
      font-size: 0.875rem;
      color: #cbd5e1;
      line-height: 1.5;
    }

    .markdown-body blockquote {
      margin: 1em 0;
      padding: 12px 16px;
      color: #cbd5e1;
      background: rgba(99, 102, 241, 0.08);
      border-left: 4px solid var(--primary);
      border-radius: 0 8px 8px 0;
    }

    .markdown-body blockquote p:last-child {
      margin-bottom: 0;
    }

    .markdown-body table {
      width: 100%;
      border-collapse: collapse;
      margin: 1.25em 0;
      font-size: 0.9rem;
    }

    .markdown-body th,
    .markdown-body td {
      border: 1px solid var(--border);
      padding: 10px 14px;
      text-align: left;
    }

    .markdown-body th {
      background: rgba(255, 255, 255, 0.05);
      font-weight: 600;
      color: #f1f5f9;
    }

    .markdown-body tr:nth-child(even) {
      background: rgba(0, 0, 0, 0.15);
    }

    .markdown-body hr {
      border: 0;
      height: 1px;
      background: var(--border);
      margin: 2em 0;
    }

    .markdown-body ul,
    .markdown-body ol {
      padding-left: 1.5em;
      margin-bottom: 1em;
    }

    .markdown-body li {
      margin-bottom: 0.35em;
    }

    /* Loader */
    .loader-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .error-container {
      padding: 24px;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 8px;
      color: #fca5a5;
      text-align: center;
      margin: 20px 0;
    }

    .error-container a {
      color: #93c5fd;
    }
  </style>
</head>

<body>
  <div class="header">
    <h2>Gaarf Syntax Documentation</h2>
    <a href="https://github.com/google/ads-api-report-fetcher/blob/main/docs/how-to-write-queries.md" target="_blank" class="github-link">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
        <polyline points="15 3 21 3 21 9"></polyline>
        <line x1="10" y1="14" x2="21" y2="3"></line>
      </svg>
      View on GitHub
    </a>
  </div>

  <div class="container">
    <div id="loader" class="loader-container">
      <div class="spinner"></div>
      <div>Loading syntax documentation...</div>
    </div>

    <div id="error" class="error-container" style="display: none;">
      <p>Failed to load documentation from GitHub.</p>
      <p>You can view the full guide directly on <a href="https://github.com/google/ads-api-report-fetcher/blob/main/docs/how-to-write-queries.md" target="_blank">GitHub</a>.</p>
    </div>

    <div id="content" class="markdown-body"></div>
  </div>

  <script>
    const GITHUB_RAW_URL = 'https://raw.githubusercontent.com/google/ads-api-report-fetcher/main/docs/how-to-write-queries.md';

    function renderMarkdown(md) {
      document.getElementById('loader').style.display = 'none';
      document.getElementById('error').style.display = 'none';
      const contentDiv = document.getElementById('content');
      contentDiv.innerHTML = marked.parse(md);
    }

    function showError() {
      document.getElementById('loader').style.display = 'none';
      document.getElementById('error').style.display = 'block';
    }

    function loadDocs() {
      // 1. Try client-side fetch first
      fetch(GITHUB_RAW_URL)
        .then(function (response) {
          if (!response.ok) throw new Error('HTTP ' + response.status);
          return response.text();
        })
        .then(function (markdown) {
          renderMarkdown(markdown);
        })
        .catch(function (clientErr) {
          console.warn('Client fetch failed, trying server-side fetch:', clientErr);
          // 2. Try server-side UrlFetchApp via google.script.run
          if (typeof google !== 'undefined' && google.script && google.script.run) {
            google.script.run
              .withSuccessHandler(function (serverMarkdown) {
                if (serverMarkdown && serverMarkdown.trim().length > 0) {
                  renderMarkdown(serverMarkdown);
                } else {
                  showError();
                }
              })
              .withFailureHandler(function (serverErr) {
                console.error('Server fetch failed:', serverErr);
                showError();
              })
              .onClientCall('getDocsMarkdown');
          } else {
            showError();
          }
        });
    }

    window.onload = loadDocs;
  </script>
</body>

</html>
